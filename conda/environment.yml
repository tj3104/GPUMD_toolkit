# conda 環境をまるごと作る場合:
#   conda env create -f conda/environment.yml
#   conda activate gpumd-toolkit
#   pip install -e .
name: gpumd-toolkit
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - ase>=3.24
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - matplotlib-base>=3.8
  - joblib>=1.4
  - netcdf4>=1.6
  - pytest>=8.0
  - pip
  - pip:
      - calorine>=3.5
